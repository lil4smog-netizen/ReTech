<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Secured - ShareTech Lab</title>
    <style>
        :root { --bg-deep: #09090b; --bg-card: #121215; --gold-glow: #d4af37; --text-pure: #ffffff; --text-dim: #a1a1aa; --border-line: #27272a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-pure); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .success-panel { background-color: var(--bg-card); border: 1px solid var(--border-line); border-radius: 16px; padding: 4rem 2.5rem; max-width: 550px; text-align: center; }
        .success-checkmark { width: 80px; height: 80px; border-radius: 50%; background: rgba(212, 175, 55, 0.1); border: 2px solid var(--gold-glow); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--gold-glow); margin: 0 auto 2rem auto; }
        h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 1rem; }
        p { color: var(--text-dim); line-height: 1.6; margin-bottom: 3rem; font-size: 1.05rem; }
        .return-btn { background-color: var(--gold-glow); color: var(--bg-deep); padding: 1rem 2.5rem; font-weight: 700; text-decoration: none; border-radius: 8px; transition: background 0.3s; }
        .return-btn:hover { background-color: #fbbf24; }
    </style>
</head>
<body>
    <div class="success-panel">
        <div class="success-checkmark">✓</div>
        <h1>Diagnostic File Received</h1>
        <p>Your hardware inventory has been logged into our local queue. Please proceed to the handover configuration hub to coordinate drop-off arrangements.</p>
        <a href="contact.html" class="return-btn">   Meetup Location</a>
    </div>
</body>
</html>
